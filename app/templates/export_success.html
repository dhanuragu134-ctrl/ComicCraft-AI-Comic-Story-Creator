<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ComicCraft - Export Successful
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #222;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 45px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 34px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 24px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .button:hover {
            background: #6d28d9;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">
        ✅
    </div>

    <h1>
        Comic Export Successful!
    </h1>

    <p>
        Your AI-powered comic has been successfully created
        and exported as a PDF.
    </p>

    <p>
        You can now save, share, and view your comic offline.
    </p>

    <a
        href="/"
        class="button"
    >
        Go Create Another Comic
    </a>

</div>

</body>

</html>
