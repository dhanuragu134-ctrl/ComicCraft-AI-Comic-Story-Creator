<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft - All Users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 40px 20px;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .empty {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 20px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>ComicCraft</h1>

        <h2>All Users</h2>

        {% if users %}

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Story Prompt</th>
                    <th>Setting</th>
                    <th>Tone</th>
                </tr>

            </thead>

            <tbody>

                {% for user in users %}

                <tr>

                    <td>{{ loop.index }}</td>

                    <td>
                        {{ user.name }}
                    </td>

                    <td>
                        {{ user.story_prompt }}
                    </td>

                    <td>
                        {{ user.setting }}
                    </td>

                    <td>
                        {{ user.tone }}
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

        {% else %}

        <div class="empty">
            No user records available.
        </div>

        {% endif %}

        <a href="/" class="button">
            ← Back to ComicCraft
        </a>

    </div>

</div>

</body>

</html>
