<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft - AI Comic Story Creator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 40px 0 20px;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #666;
            font-size: 18px;
        }

        .hero {
            text-align: center;
            padding: 30px 0;
        }

        .eyebrow {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #7c3aed;
        }

        .hero h2 {
            font-size: 38px;
            margin: 10px 0;
        }

        .hero-text {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            margin-bottom: 40px;
        }

        .comic-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea,
        input,
        select {
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .primary-button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary-button:hover {
            background: #6d28d9;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>ComicCraft</h1>
            <p>AI Comic Story Creator</p>
        </header>

        {% block content %}
        {% endblock %}

    </div>

</body>

</html>
